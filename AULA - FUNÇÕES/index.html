<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>Aula 08 - FUNÇÕES</h1>
        <p>Reune comandos que podem ser chamados varias vezes</p>
        <section>
            <h2>Calculadora de desconto</h2>
            <label for="preco">Preço do produto:</label>
            <input type="number" id="preco" min="0" placeholder="Ex.: 100">
            <label for="desconto">Desconto (%):</label>
            <input type="number" id="desconto" min="0" max="100" placeholder="Ex.:10">
            <button type="button" id="calcular">Calcular desconto</button>
            <p id="resultado" class="resultado" role="status">Resultado do desconto.</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas Escolares</title>
</head>
<body>

    <h1>Sistema de Notas Escolares</h1>

    <p>Informe as três notas do aluno:</p>

    <label for="nota1">Nota 1:</label>
    <input type="number" id="nota1" step="any"><br><br>

    <label for="nota2">Nota 2:</label>
    <input type="number" id="nota2" step="any"><br><br>

    <label for="nota3">Nota 3:</label>
    <input type="number" id="nota3" step="any"><br><br>

    <button type="button" id="calcular">Calcular média</button>

    <p id="resultado" aria-live="polite"></p>
    <p id="finalizacao"></p>

    <script src="script.js"></script>
</body>
</html>
